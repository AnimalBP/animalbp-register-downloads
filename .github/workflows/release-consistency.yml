name: Public release consistency

on:
  release:
    types: [published, edited]
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - README.md
      - RELEASE-NOTES.md
      - RELEASE-CHECKLIST.md
      - SHA256SUMS.txt
      - scripts/verify_public_release.py
      - scripts/test_verify_public_release.py
      - scripts/verify_web_demo.py
      - scripts/test_verify_web_demo.py
      - scripts/verify_protected_website.py
      - scripts/test_verify_protected_website.py
      - website-verification-policy.json
      - .github/workflows/release-consistency.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Verifier tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the consistency guard offline
        run: python3 -m unittest discover -s scripts -p 'test_verify*.py' -v
  verify:
    name: Live public release
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current public documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Release events point at a tag; always check the current default
          # branch so the daily and release checks inspect the same documents.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify current documentation, public release, web/demo and website catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_public_release.py
